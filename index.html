:root{--bg:#FAF8F5;--surf:#FFFFFF;--text:#2B2B2B;--muted:#6B6B6B;--line:#ECE8E2;--acc:#2F7D8C;--tint:#DDF0F2;--ink:#2B2B2B;
--fy:#FFD166;--fs:#8CCFE6;--fr:#F4978E;--fg:#93D5AB;--fp:#BBA8EA;--fo:#F6AE6B;--fe:#D9DDE3;--fb:#C99B6D;--fw:#FFFFFF;--ft:#E9B48C;
--ui:"VSM UI",Lato,"Segoe UI",system-ui,-apple-system,sans-serif}
.dark{--bg:#16181D;--surf:#21242B;--text:#ECECEC;--muted:#A9ADB5;--line:#33373F;--tint:#1E3A40}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 var(--ui);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.ic{display:block;width:100%;height:100%}.ic *{stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ic .ky{stroke:var(--ky)}.ic .kr{stroke:var(--kr)}.ic .ks{stroke:var(--ks)}.ic .kg{stroke:var(--kg)}.ic .kp{stroke:var(--kp)}.ic .ko{stroke:var(--ko)}.ic .ke{stroke:var(--ke)}.ic .kb{stroke:var(--kb)}.ic .kw{stroke:var(--kw)}.ic .kt{stroke:var(--kt)}
.paint .ic *{stroke-width:2.2}.paint .ic line,.paint .ic [fill=none]{stroke-width:2.4}.paint .ic .sh{filter:url(#vsm-drop)}
#app{display:flex;min-height:100vh}
#side{width:228px;flex:none;background:var(--surf);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}.brand b{font-size:16px;line-height:1.15}.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.logo{width:38px;height:38px;flex:none}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;font-weight:700;color:var(--text)}
.nav svg{width:20px;height:20px;flex:none}.nav:hover{background:var(--tint)}.nav.on{background:var(--acc);color:#fff}.nav.on svg *{stroke:#fff}
.nav svg *{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:8px}
#main{flex:1;min-width:0;padding:26px 30px 90px;max-width:1180px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:22px 0 10px}.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;display:inline-flex;gap:8px;align-items:center;min-height:42px}
.btn.sec{background:var(--surf);color:var(--text);border:1.5px solid var(--line)}.btn.sm{padding:6px 11px;min-height:34px;font-size:13.5px}
.btn.danger{background:#B83A3A}.btn:disabled{opacity:.45;cursor:default}
.btn.icon{padding:6px;min-width:34px;justify-content:center}
input[type=text],input[type=search],input[type=time],input[type=number],select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surf);min-height:42px;width:100%}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.03em}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);background:var(--surf);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13.5px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.stat .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.stat .v{font-size:26px;font-weight:900}
.welcome{background:var(--tint);border-color:transparent;display:flex;gap:16px;align-items:center}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bt{display:flex;flex-direction:column;gap:10px}.bt h3{margin:0;font-size:16px}.bt .meta{font-size:12.5px;color:var(--muted)}
.mini{display:flex;gap:6px;height:58px}.mini .vc{width:58px;height:58px;padding:3px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--tint);color:var(--acc)}

function newBoard(type, pid, tpl) {

function onClick(e) {

  var a = el.getAttribute('data-a'), x = el.getAttribute('data-x'), y = el.getAttribute('data-y');
  var b = ED ? board(ED) : null;
  switch (a) {
    case 'go': go(x); break;
    case 'pick': S.active = x; save(); render(); break;
    case 'hidewelcome': S.welcome = false; save(); render(); break;
    case 'undo': if (window.__undo) { window.__undo(); window.__undo = null; $('#toast').style.display = 'none'; } break;
    case 'mk': var nb = newBoard(x, S.active, y); S.boards.push(nb); S.made++; save(); go('editor', nb.id); toast('Board made — change any card you like.'); break;
    case 'edit': go('editor', x); break;
    case 'play': childOpen(x); break;
    case 'printb': PR.what = 'board'; PR.bid = x; go('print'); break;
    case 'dup': var src = board(x), cp = clone(src); cp.id = uid(); cp.title = (src.title + ' (copy)').slice(0, 60); cp.items.forEach(function (i) { i.id = uid(); }); S.boards.splice(S.boards.indexOf(src) + 1, 0, cp); save(); go('editor', cp.id); toast('Copied.'); break;
    case 'delb': var db = board(x), di = S.boards.indexOf(db); S.boards.splice(di, 1); save(); go('boards'); toast('Board deleted.', function () { S.boards.splice(di, 0, db); save(); render(); }); break;
    case 'up': case 'down': var i = +x, j = a === 'up' ? i - 1 : i + 1; var t = b.items[i]; b.items[i] = b.items[j]; b.items[j] = t; save(); render(); break;
    case 'rm': var ri = +x, rit = b.items.splice(ri, 1)[0]; save(); render(); toast('Card removed.', function () { b.items.splice(ri, 0, rit); save(); render(); }); break;
    case 'add': openPicker(function (it) { b.items.push(it); save(); render(); }); break;
    case 'addtext': b.items.push(item(null, 'New card')); save(); render(); setTimeout(function () { var ins = document.querySelectorAll('[data-k="label"]'); var l = ins[ins.length - 1]; if (l) { l.focus(); l.select(); } }, 30); break;
    case 'swap': var si = +x; openPicker(function (it) { var old = b.items[si]; it.id = old.id; it.time = old.time; it.min = old.min; it.sec = old.sec; it.label2 = it.label2 || old.label2; b.items[si] = it; save(); render(); }); break;
    default: if (window.onClick2) window.onClick2(a, x, y, el, e);
  }
}
function onInput(e) {
  var el = e.target, b = ED ? board(ED) : null;
  if (el.hasAttribute('data-it') && b) {
    var it = b.items[+el.getAttribute('data-it')], k = el.getAttribute('data-k');
    it[k] = k === 'min' ? +el.value : el.value.slice(0, 40);
    if (k === 'sec' && b.opts.sections) { var order = { am: 0, pm: 1, eve: 2, '': 3 }; b.items.sort(function (p, q) { return order[p.sec] - order[q.sec]; }); }
    save(); if (e.type === 'change' && el.tagName === 'SELECT') render(); else refreshPreview(); return;
  }
  var f = el.getAttribute('data-f');
  if (f && b) {
    var v = el.type === 'checkbox' ? el.checked : el.value;
    if (f === 'title') b.title = v.slice(0, 60);
    else if (f === 'pid') b.pid = v;
    else if (f.indexOf('o.') === 0) { var k2 = f.slice(2); b.opts[k2] = k2 === 'tokens' ? +v : v; if (k2 === 'times' && v && !b.items.some(function (i) { return i.time; })) autoTimes(b); if (k2 === 'sections' && v) autoSections(b); }
    else if (f.indexOf('h.') === 0) b.opts.heads[f.slice(2)] = v.slice(0, 24);
    save(); if (e.type === 'change' && el.type !== 'text') render(); else refreshPreview(); return;
  }

}
function autoSections(b) {

}
